<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Свод — скелет</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 40px auto; }
    .result { border: 1px solid #ccc; padding: 12px; margin: 16px 0; }
  </style>
</head>
<body>
  <!-- Слой интерфейса: форма и показ результата. -->
  <h1>Свод — скелет</h1>

  <form action="/upload" method="post" enctype="multipart/form-data">
    <input type="file" name="file" required>
    <button type="submit">Обработать</button>
  </form>

  {% if last %}
  <div class="result">
    <b>{{ last.filename }}</b>
    <p>{{ last.summary }}</p>
  </div>
  {% endif %}

  <h2>История</h2>
  <ul>
    {% for doc in documents %}
    <li>{{ doc.created_at }} — {{ doc.filename }}</li>
    {% else %}
    <li>Пока ничего не загружено</li>
    {% endfor %}
  </ul>
</body>
</html>
